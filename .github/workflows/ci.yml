name: CI

on:
  push:
    paths-ignore:
      - "*.md"
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    paths-ignore:
      - "*.md"
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Bun
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun fmt --check
      - run: bun check
      - run: bun test --coverage
      - run: bun run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  node:
    name: Node.js v${{ matrix.nodejs }}
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        nodejs: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.nodejs }}

      - run: bun install --frozen-lockfile --production
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Import
        run: node --input-type=module -e "import * as m from 'seolint'; import { resolve } from 'seolint/config'; if (!await m.lint('<html></html>', await resolve())) process.exit(1)"

      - name: CLI
        working-directory: src/fixtures
        run: |
          node ../../dist/bin.js site/index.html -H https://example.com
          ! node ../../dist/bin.js site -H https://example.com

  example:
    name: Example
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run example build

      - name: Lint
        working-directory: example
        run: |
          set +e
          node node_modules/seolint/dist/bin.js --format json > report.json
          code=$?
          set -e
          errors=$(jq '[.[][] | select(.severity == "error")] | length' report.json)
          warnings=$(jq '[.[][] | select(.severity == "warn")] | length' report.json)
          echo "exit=$code errors=$errors warnings=$warnings"
          test "$code" = 1 && test "$errors" = 22 && test "$warnings" = 5

  www:
    name: Site
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run www build
      - run: bun run www lint --format ci

  publish:
    name: Publish to npm
    needs: [check, node, example, www]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing, with provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Check version
        run: |
          version=$(jq -r .version package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json is v$version, but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Publish
        run: |
          tag=latest
          if [[ "$GITHUB_REF_NAME" == *-next.* ]]; then tag=next; fi
          npm publish --provenance --access public --tag $tag
