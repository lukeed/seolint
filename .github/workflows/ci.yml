name: CI

on:
  push:
    paths-ignore:
      - "*.md"
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
    paths-ignore:
      - "*.md"
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Bun
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun fmt --check
      - run: bun check
      - run: bun test --coverage
      - run: bun run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  node:
    name: Node.js v${{ matrix.nodejs }}
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        nodejs: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.nodejs }}

      - run: bun install --frozen-lockfile --production
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Import
        run: node --input-type=module -e "import * as m from 'seolint'; if (!await m.lint('<html></html>', await m.config())) process.exit(1)"

      - name: CLI
        working-directory: src/fixtures
        run: |
          node ../../dist/bin.js site/good.html -H https://example.com
          ! node ../../dist/bin.js site -H https://example.com
